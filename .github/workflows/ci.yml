name: CI

on:
  push:
    branches: [main, feature/finish-quote-admin]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_BUSINESS_PHONE: "7373144215"
          NEXT_PUBLIC_BUSINESS_EMAIL: nietogreencare@gmail.com
